<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anti Vaping Awareness</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fdfdfd;
      color: #333;
      line-height: 1.6;
    }

    h1, h2, h3 {
      margin: 10px 0;
      font-weight: 700;
    }

    h1 { font-size: 2.5rem; color: #007BFF; }
    h2 { font-size: 2rem; color: #0056b3; }
    h3 { font-size: 1.5rem; color: #333; }

    p { margin: 10px 0; }

    .container { width: 90%; max-width: 1200px; margin: auto; }

    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 8px;
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }

    .card {
      background-color: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .page-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }

    .page-buttons button {
      font-size: 22px;
    }

    .image-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    .image-row img {
      width: 20%;
      max-width: 200px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>Learn. Think. Choose. Stay Safe from Vaping</h1>
    <p style="font-size: 1.2rem;">
      This website is dedicated to helping teens and young adults understand the dangers of vaping.
      Explore the chemicals, teen experiences, and laws that impact your health and choices.
    </p>
    <h2>Explore These Pages To Learn More</h2>
  </div>

  <div class="page-buttons">
    <a href="page1.html"><button>Page 1: Introduction</button></a>
    <a href="page2.html"><button>Page 2: Health Risks</button></a>
    <a href="page3.html"><button>Page 3: Social Influence And Peer Pressure</button></a>
  </div>

  <div class="image-row">
    <img src="images/indeximg2.jpeg" alt="Image 2">
    <img src="images/indeximg1.jpeg" alt="Image 1">
  </div>

  <div class="page-buttons">
    <a href="page4.html"><button>Page 4: Whats Inside A Vape</button></a>
    <a href="page5.html"><button>Page 5: Teen Voices</button></a>
    <a href="page6.html"><button>Page 6: Laws and Regulation</button></a>
  </div>

  <div class="image-row">
    <img src="images/indeximg4.jpeg" alt="Image 4">
    <img src="images/indeximg3.jpeg" alt="Image 3">
  </div>

  <div class="page-buttons">
    <a href="page7.html"><button>Page 7: Conclusion</button></a>
  </div>
</div>
</body>
</html>
